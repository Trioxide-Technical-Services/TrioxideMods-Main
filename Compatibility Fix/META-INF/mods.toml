[[mods]]
modId="backrooms_terralith_compat"
version="1.0.0"
displayName="Backrooms-Terralith Compatibility Fix"
authors="TrioxideMods"
description='''
Fixes compatibility issues between Faithful Backrooms and Terralith mods.
Specifically addresses the Almond Forest biome not spawning properly.

This mod ensures that the Almond Forest biome generates with proper terrain
instead of appearing inside walls or with incorrect surface generation.
'''

[[dependencies.backrooms_terralith_compat]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.backrooms_terralith_compat]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.backrooms_terralith_compat]]
    modId="faithfulbackrooms"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.backrooms_terralith_compat]]
    modId="terralith"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
